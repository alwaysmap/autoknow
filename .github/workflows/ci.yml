name: CI

# Pull-request gates. Make these required status checks (branch protection) so nothing
# corrupting can reach main. Four jobs:
#   migrations-lint — the cheap git-history gates, sharing one `fetch-depth: 0` checkout:
#                     destructive migrations without a reviewed opt-in tag, mixed
#                     infra+app PRs, and substantive PRs with no `compound:` declaration.
#   quality         — typecheck, lint, jest (unit+DB), and a prod build. Added after
#                     PR #15 merged green while breaking e2e: merges auto-deploy, so
#                     drift main-ward must be caught pre-merge.
#   e2e             — the trimmed Playwright suite (chromium flows + webkit
#                     engine-sensitive specs) against a prod build. SPLIT OUT of
#                     `quality`: the two shared one serial ~23-min job that brushed the
#                     25-min ceiling and got cancelled at random (e.g. PR #88 killed at
#                     25m0s mid-`playwright install`, having never reached e2e/build).
#                     e2e is the long pole — it pays the Playwright OS-deps apt install
#                     AND compiles its own `next build` web server — so running it in
#                     PARALLEL with the fast checks makes the critical path max(fast,
#                     e2e) instead of their sum, and gives each half its own timeout
#                     with real headroom for growth.
#   image           — the Dockerfile itself. `npm run build` proves the app compiles;
#                     it does NOT prove the IMAGE builds, and the deploy pipeline
#                     builds in Docker only after merge (ADR npm-ci-bootstraps-a-checkout-but-nothing-depends-on-it).
on:
  pull_request:

permissions:
  contents: read

# One in-flight CI run per PR branch: a fresh push cancels the previous run's jobs
# instead of letting a now-stale run burn ~6-30 min of runner minutes to completion.
# github.head_ref is the PR's source branch (set on pull_request events); the
# github.ref fallback keeps the group well-defined if a non-PR trigger is ever added.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  migrations-lint:
    name: migrations-lint
    runs-on: ubuntu-latest
    # Every gate below diffs the branch against the PR's base; each refuses to run
    # rather than pass on an empty diff if this does not resolve (scripts/ci/lib.sh).
    env:
      BASE_REF: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff new migrations vs the base branch
      - name: Block destructive migrations without opt-in
        run: npm run ci:lint-migrations
      - name: Block mixed infra+app PRs (deploy-ordering rule)
        run: npm run ci:lint-ordering
      - name: Require a compound declaration on substantive PRs
        run: npm run ci:lint-compound

  quality:
    name: quality (typecheck · lint · jest · build)
    runs-on: ubuntu-latest
    # The fast half: no browsers, no e2e web server. Comfortably ~2× headroom over its
    # real cost — the e2e job (below) carries the long pole on its own budget.
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoknow
        ports:
          - 5432:5432
        # `-h localhost` forces the health check over TCP. Without it, pg_isready
        # checks the Unix socket, which the official image's first-boot init phase
        # opens BEFORE the real server binds TCP on the mapped port — so the socket
        # check can mark the container "healthy" while a host-side connection to
        # :5432 still gets ECONNREFUSED. The truth-bearing gate is the host-side
        # "Wait for Postgres" step below; this just stops the signal from lying.
        options: >-
          --health-cmd="pg_isready -h localhost -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # jest's DB suites derive and self-provision the disposable autoknow_test DB from
      # this (tests/helpers/testDatabaseUrl + tests/global-setup) — the suite can never
      # touch a non-_test database by construction.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoknow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `cache: npm` above only caches the download tarballs — `npm ci` still linked ~27s
      # of node_modules every run. Cache the built tree itself, keyed on the lockfile.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # Deliberately explicit, though `npm ci`'s postinstall also generates it: CI
      # must not depend on a lifecycle-script side effect. `--ignore-scripts`
      # anywhere upstream would otherwise leave no client and fail as a confusing
      # typecheck error. `prisma generate` is idempotent, so the cost is seconds.
      # ADR npm-ci-bootstraps-a-checkout-but-nothing-depends-on-it.
      # This is also why the step is NOT conditional on the cache: a node_modules hit
      # means npm ci (and its postinstall) never ran, so the cached client could be stale
      # against a changed schema.
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      # Prove the DB is reachable over TCP from the runner before jest's DB suites
      # connect — see the composite action for the why.
      - uses: ./.github/actions/wait-for-postgres
      - run: npm run test
      # The deploy pipeline builds in Docker AFTER merge — catch build breaks here,
      # before they can turn into a red post-merge deploy. Same dummy-DB pattern as
      # the Dockerfile: nothing dynamic touches the DB at build time (the e2e job below
      # builds a SEPARATE prod server against the real test DB; this asserts the
      # DB-less build contract the Docker image relies on).
      # Next's incremental compile cache. This job builds into the default .next (the e2e
      # job caches .next-test separately), so the two never share or clobber a key.
      - name: Cache the production build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-build-${{ runner.os }}-
      - name: Production build compiles
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: npm run build

  e2e:
    # ONE JOB PER BROWSER, in parallel. Measured on run 30186686741, the single job was
    # 5m43s and WAS the whole workflow's critical path: 60s of `--with-deps` apt + 218s of
    # serial `next build` + tests. Splitting makes the e2e cost max(chromium, webkit)
    # instead of their sum, and lets each shard apt-install only the browser it runs —
    # chromium's dep set is far smaller than webkit's, and chromium is the long pole.
    #
    # Safe to shard because each matrix leg is a SEPARATE runner with its OWN postgres
    # service, so the "one shared test DB, workers:1" constraint that playwright.config.ts
    # documents still holds WITHIN a leg. Raising `workers` above 1 is the much larger win
    # and needs per-worker databases first — bead autoknow-7mb, deliberately not bundled
    # here.
    name: e2e (playwright · ${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # a webkit-only break must not hide a chromium result, or vice versa
      matrix:
        project: [chromium, webkit]
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoknow
        ports:
          - 5432:5432
        # `-h localhost` forces the health check over TCP. Without it, pg_isready
        # checks the Unix socket, which the official image's first-boot init phase
        # opens BEFORE the real server binds TCP on the mapped port — so the socket
        # check can mark the container "healthy" while a host-side connection to
        # :5432 still gets ECONNREFUSED. The truth-bearing gate is the host-side
        # "Wait for Postgres" step below; this just stops the signal from lying.
        options: >-
          --health-cmd="pg_isready -h localhost -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # global-setup connects to the /postgres maintenance DB on this host to create the
      # per-worktree autoknow_<token>_test DB, then `prisma db push` syncs the schema.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoknow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `cache: npm` above only caches the download tarballs — `npm ci` still linked ~26s
      # of node_modules every run. Cache the built tree itself, keyed on the lockfile, and
      # skip the install entirely on a hit.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      # global-setup runs `prisma db push`, so the client must exist here too — same
      # explicit-generate reasoning as the quality job. Always run it: on a node_modules
      # cache hit npm ci did NOT run, so postinstall did not either, and the cached tree's
      # generated client can be stale against a changed schema.
      - run: npm run db:generate
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}
      # Only this leg's browser. `--with-deps` stays because the apt libs are NOT part of
      # the cached browser payload and webkit genuinely needs them, but chromium's set is
      # much smaller than the combined install this replaced.
      - run: npx playwright install --with-deps ${{ matrix.project }}
      # The e2e webServer builds into NEXT_DIST_DIR=.next-test (playwright.config.ts), NOT
      # .next — so this is the path that matters here. Next's own incremental cache lives
      # under it and turns the cold `next build` inside webServer into a warm one.
      - name: Cache the e2e production build
        uses: actions/cache@v4
        with:
          path: .next-test/cache
          key: next-e2e-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}-
            next-e2e-${{ runner.os }}-${{ matrix.project }}-
      # global-setup connects to the DB the instant the run starts, so prove the mapped
      # port is reachable first — same gate as the quality job.
      - uses: ./.github/actions/wait-for-postgres
      - run: npm run test:e2e:${{ matrix.project }}

  image:
    name: image (Dockerfile builds; deps-stage postinstall contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Runs in parallel with `quality`/`e2e`, both far longer, so this is close to
      # free in wall-clock. It covers two things nothing else does:
      #   1. the image builds at all — merges auto-deploy (ADR premerge-quality-gate), so a broken
      #      Dockerfile used to surface as a red deploy rather than a red PR;
      #   2. the deps stage's contract — `npm ci` runs postinstall there WITHOUT the
      #      source tree, so the bootstrap must degrade to nothing (ADR npm-ci-bootstraps-a-checkout-but-nothing-depends-on-it).
      # No push, no registry credentials: building is the whole assertion.
      #
      # Layer-cached through the Actions cache (buildx `type=gha`): the measured 95s was a
      # from-scratch build every run, and the expensive layer — the deps stage's `npm ci` —
      # only changes when package-lock.json does. `mode=max` caches intermediate stages
      # too, which is the point: the deps stage is exactly the one worth keeping.
      # This job is NOT the critical path (it finished in 1m36 against e2e's 5m43), so
      # this buys runner MINUTES, not wall clock.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: autoknow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
