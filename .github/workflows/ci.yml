name: CI

# Pull-request gates. Make these required status checks (branch protection) so nothing
# corrupting can reach main. Four jobs:
#   migrations-lint — blocks destructive migrations without a reviewed opt-in tag.
#   quality         — typecheck, lint, jest (unit+DB), and a prod build. Added after
#                     PR #15 merged green while breaking e2e: merges auto-deploy, so
#                     drift main-ward must be caught pre-merge.
#   e2e             — the trimmed Playwright suite (chromium flows + webkit
#                     engine-sensitive specs) against a prod build. SPLIT OUT of
#                     `quality`: the two shared one serial ~23-min job that brushed the
#                     25-min ceiling and got cancelled at random (e.g. PR #88 killed at
#                     25m0s mid-`playwright install`, having never reached e2e/build).
#                     e2e is the long pole — it pays the Playwright OS-deps apt install
#                     AND compiles its own `next build` web server — so running it in
#                     PARALLEL with the fast checks makes the critical path max(fast,
#                     e2e) instead of their sum, and gives each half its own timeout
#                     with real headroom for growth.
#   image           — the Dockerfile itself. `npm run build` proves the app compiles;
#                     it does NOT prove the IMAGE builds, and the deploy pipeline
#                     builds in Docker only after merge (ADR npm-ci-bootstraps-a-checkout-but-nothing-depends-on-it).
on:
  pull_request:

permissions:
  contents: read

# One in-flight CI run per PR branch: a fresh push cancels the previous run's jobs
# instead of letting a now-stale run burn ~6-30 min of runner minutes to completion.
# github.head_ref is the PR's source branch (set on pull_request events); the
# github.ref fallback keeps the group well-defined if a non-PR trigger is ever added.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  migrations-lint:
    name: migrations-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need history to diff new migrations vs the base branch
      - name: Block destructive migrations without opt-in
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: npm run ci:lint-migrations
      - name: Block mixed infra+app PRs (deploy-ordering rule)
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: npm run ci:lint-ordering

  quality:
    name: quality (typecheck · lint · jest · build)
    runs-on: ubuntu-latest
    # The fast half: no browsers, no e2e web server. Comfortably ~2× headroom over its
    # real cost — the e2e job (below) carries the long pole on its own budget.
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoknow
        ports:
          - 5432:5432
        # `-h localhost` forces the health check over TCP. Without it, pg_isready
        # checks the Unix socket, which the official image's first-boot init phase
        # opens BEFORE the real server binds TCP on the mapped port — so the socket
        # check can mark the container "healthy" while a host-side connection to
        # :5432 still gets ECONNREFUSED. The truth-bearing gate is the host-side
        # "Wait for Postgres" step below; this just stops the signal from lying.
        options: >-
          --health-cmd="pg_isready -h localhost -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # jest's DB suites derive and self-provision the disposable autoknow_test DB from
      # this (tests/helpers/testDatabaseUrl + tests/global-setup) — the suite can never
      # touch a non-_test database by construction.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoknow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Deliberately explicit, though `npm ci`'s postinstall also generates it: CI
      # must not depend on a lifecycle-script side effect. `--ignore-scripts`
      # anywhere upstream would otherwise leave no client and fail as a confusing
      # typecheck error. `prisma generate` is idempotent, so the cost is seconds.
      # ADR npm-ci-bootstraps-a-checkout-but-nothing-depends-on-it.
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      # Prove the DB is reachable over TCP from the runner before jest's DB suites
      # connect — see the composite action for the why.
      - uses: ./.github/actions/wait-for-postgres
      - run: npm run test
      # The deploy pipeline builds in Docker AFTER merge — catch build breaks here,
      # before they can turn into a red post-merge deploy. Same dummy-DB pattern as
      # the Dockerfile: nothing dynamic touches the DB at build time (the e2e job below
      # builds a SEPARATE prod server against the real test DB; this asserts the
      # DB-less build contract the Docker image relies on).
      - name: Production build compiles
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
        run: npm run build

  e2e:
    name: e2e (playwright · chromium + webkit)
    runs-on: ubuntu-latest
    # Runs in PARALLEL with `quality`. It owns the two costs that used to tip the shared
    # job over 25m — the `--with-deps` apt install (webkit needs the OS libs even on a
    # browser-cache hit) and its own `next build` web server (playwright.config.ts) — so
    # a 30m ceiling here is real headroom, not a shared squeeze.
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoknow
        ports:
          - 5432:5432
        # `-h localhost` forces the health check over TCP. Without it, pg_isready
        # checks the Unix socket, which the official image's first-boot init phase
        # opens BEFORE the real server binds TCP on the mapped port — so the socket
        # check can mark the container "healthy" while a host-side connection to
        # :5432 still gets ECONNREFUSED. The truth-bearing gate is the host-side
        # "Wait for Postgres" step below; this just stops the signal from lying.
        options: >-
          --health-cmd="pg_isready -h localhost -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # global-setup connects to the /postgres maintenance DB on this host to create the
      # per-worktree autoknow_<token>_test DB, then `prisma db push` syncs the schema.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autoknow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # global-setup runs `prisma db push`, so the client must exist here too — same
      # explicit-generate reasoning as the quality job.
      - run: npm run db:generate
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      # global-setup connects to the DB the instant `npm run test:e2e` starts, so
      # prove the mapped port is reachable first — same gate as the quality job.
      - uses: ./.github/actions/wait-for-postgres
      - run: npm run test:e2e

  image:
    name: image (Dockerfile builds; deps-stage postinstall contract)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Runs in parallel with `quality`/`e2e`, both far longer, so this is close to
      # free in wall-clock. It covers two things nothing else does:
      #   1. the image builds at all — merges auto-deploy (ADR premerge-quality-gate), so a broken
      #      Dockerfile used to surface as a red deploy rather than a red PR;
      #   2. the deps stage's contract — `npm ci` runs postinstall there WITHOUT the
      #      source tree, so the bootstrap must degrade to nothing (ADR npm-ci-bootstraps-a-checkout-but-nothing-depends-on-it).
      # No push, no registry credentials: building is the whole assertion.
      - run: docker build -t autoknow:ci .
