name: Deploy app

# App CD. Two ordered jobs per instance: migrate (forward-only DB migrations) then deploy
# (build → push → Cloud Run, gated on migrate). Keyless via Workload Identity Federation.
# All logic lives in scripts/ci/*.sh; this file only wires inputs. See docs/CHANGE_PLAYBOOK.md.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'next.config.ts'
      - 'scripts/ci/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Serialize deploys. Without this, merges in quick succession race their
# `gcloud run services update` calls: runs can finish out of order, leaving prod
# serving an OLDER commit than the newest successful run, and losing runs fail
# with an ABORTED version-conflict (observed 2026-07-20, five queued merges).
# One group = one run at a time; with cancel-in-progress off, GitHub keeps only
# the NEWEST queued run per group, so the latest commit always deploys last.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate ${{ matrix.instance.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance:
          - name: alwaysmap
            project: autoknow-prod-1895f1
            sql_connection: autoknow-prod-1895f1:us-central1:autoknow-pg
            workload_identity_provider: projects/1009926574065/locations/global/workloadIdentityPools/github/providers/github
            service_account: autoknow-ci@autoknow-prod-1895f1.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ matrix.instance.workload_identity_provider }}
          service_account: ${{ matrix.instance.service_account }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Migrate database
        env:
          INSTANCE_PROJECT: ${{ matrix.instance.project }}
          INSTANCE_SQL_CONNECTION: ${{ matrix.instance.sql_connection }}
        run: scripts/ci/migrate.sh

  deploy:
    name: deploy ${{ matrix.instance.name }}
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance:
          - name: alwaysmap
            project: autoknow-prod-1895f1
            region: us-central1
            service: autoknow
            image: us-central1-docker.pkg.dev/autoknow-prod-1895f1/autoknow/autoknow
            workload_identity_provider: projects/1009926574065/locations/global/workloadIdentityPools/github/providers/github
            service_account: autoknow-ci@autoknow-prod-1895f1.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ matrix.instance.workload_identity_provider }}
          service_account: ${{ matrix.instance.service_account }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build & deploy
        env:
          IMAGE: ${{ matrix.instance.image }}
          GIT_SHA: ${{ github.sha }}
          INSTANCE_PROJECT: ${{ matrix.instance.project }}
          INSTANCE_REGION: ${{ matrix.instance.region }}
          INSTANCE_SERVICE: ${{ matrix.instance.service }}
        run: scripts/ci/build-and-deploy.sh
