name: Harden DB role

# Manual, verified application of the least-privilege runtime role (scripts/db/harden.sh).
# Run MODE=diagnose first to see the DB's actual role model, then MODE=apply to restrict
# `app` to DML-only and confirm it. Never runs on push.
#
# WHEN THIS IS NEEDED (rarely — applied + verified live 2026-07): only for (a) a NEW
# instance, or (b) re-verify/re-apply after a restore or suspected role drift.
# ALTER DEFAULT PRIVILEGES in harden-roles.sql auto-grants DML on tables future
# migrations create, so routine schema changes never require a re-run. Dormant ≠ dead:
# this is the repair path for the playbook's enforcement rule #1 — keep it.
on:
  workflow_dispatch:
    inputs:
      instance:
        description: 'Instance (matches instances/<name>.tfvars)'
        default: alwaysmap
      mode:
        description: 'diagnose or apply'
        default: diagnose

permissions:
  contents: read
  id-token: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1009926574065/locations/global/workloadIdentityPools/github/providers/github
          service_account: autoknow-ci@autoknow-prod-1895f1.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Harden (${{ github.event.inputs.mode }})
        env:
          INSTANCE_PROJECT: autoknow-prod-1895f1
          INSTANCE_SQL_CONNECTION: autoknow-prod-1895f1:us-central1:autoknow-pg
          MODE: ${{ github.event.inputs.mode }}
        run: npm run ci:harden-db
